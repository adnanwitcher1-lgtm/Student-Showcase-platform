# Gateway: React (SPA) + Django API ek hi port par.
# Same origin hone ki wajah se CORS ka masla nahi aata.

upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static site zips / screenshots ke liye
    client_max_body_size 100m;

    # Django: API, Django admin (/admin/ trailing slash ke saath), allauth, admin static files.
    # Note: React ka dashboard /admin (bina slash) par hai, wo neeche SPA fallback se serve hota hai.
    location ~ ^/(api|admin|accounts|static)/ {
        proxy_pass http://django;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Vite ke hashed files: lamba cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router: har route par index.html
    location / {
        try_files $uri /index.html;
    }
}
