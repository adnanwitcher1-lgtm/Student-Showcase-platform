# VPS deployment: web + db + redis + minio(silo) + celery + gateway(nginx + React build)
# Chalane ka tareeqa: DEPLOY_GUIDE.md dekho.
# Sirf 2 ports bahar khulte hain: PUBLIC_PORT (website) aur MINIO_PUBLIC_PORT (file storage).

x-app: &app
  build: .
  image: student-showcase-backend:latest
  env_file: .env
  restart: unless-stopped

services:
  web:
    <<: *app
    command: ./docker-start.sh
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started

  celery_worker:
    <<: *app
    command: celery -A core worker -l info --concurrency=2
    depends_on:
      - web

  celery_beat:
    <<: *app
    command: celery -A core beat -l info
    depends_on:
      - web

  db:
    image: postgres:16
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  minio:
    image: docker.io/pgsty/silo:RELEASE.2026-10-18T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_PUBLIC_PORT:-9100}:9000"
    restart: unless-stopped

  # Ek baar chalta hai: dono buckets banata hai aur demos bucket ko public-read karta hai
  minio_setup:
    image: docker.io/pgsty/silo:RELEASE.2026-10-18T00-00-00Z
    depends_on:
      - minio
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME}
      MINIO_DEMOS_BUCKET_NAME: ${MINIO_DEMOS_BUCKET_NAME}
    entrypoint: >
      /bin/sh -c "
      until mcli alias set local http://minio:9000 $$MINIO_ACCESS_KEY $$MINIO_SECRET_KEY; do echo 'waiting for minio...'; sleep 2; done;
      mcli mb --ignore-existing local/$$MINIO_BUCKET_NAME;
      mcli mb --ignore-existing local/$$MINIO_DEMOS_BUCKET_NAME;
      mcli anonymous set download local/$$MINIO_DEMOS_BUCKET_NAME;
      echo 'buckets ready';
      "
    restart: "no"

  # React build + nginx. API requests Django (web) ko proxy hoti hain.
  gateway:
    build:
      context: ${FRONTEND_DIR:-../Student-Showcase-frontend}
      args:
        VITE_API_URL: ${PUBLIC_URL}/api
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${PUBLIC_PORT:-8100}:80"
    depends_on:
      - web
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
